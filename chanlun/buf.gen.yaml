# chanlun's Go and TypeScript code, made from proto/chanlun.proto by `make generate`; the Go package's path is given here, so
# that the .proto holds nothing of any one language.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      value: github.com/zhifengzhang-sz/qi-v2-contracts/chanlun/go/chanlun
plugins:
  - local: protoc-gen-go
    out: chanlun/go/chanlun
    opt: paths=source_relative
  - local: protoc-gen-es
    out: chanlun/ts/src
    opt: target=ts
inputs:
  - directory: chanlun/proto
