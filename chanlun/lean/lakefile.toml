name = "chanlun"
version = "3.1.0"
defaultTargets = ["Chanlun", "decode"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The market data contract, whose units and JSON the records take (../../market/SPEC.md): its Lake package, beside
# this one in the repository, and in a git require of it.
[[require]]
name = "market"
path = "../../market/lean"

# 缠论's contract (../SPEC.md): what the algorithm makes beyond the K-line as structures (Chanlun/Contract.lean), and a
# run's records as JSON, decoded with every rule and encoded as the canonical text (Chanlun/Codec.lean). No Mathlib.
[[lean_lib]]
name = "Chanlun"

# A run's JSON decoded and written again as its canonical JSON: the conformance check's Lean side.
[[lean_exe]]
name = "decode"
root = "Main"
